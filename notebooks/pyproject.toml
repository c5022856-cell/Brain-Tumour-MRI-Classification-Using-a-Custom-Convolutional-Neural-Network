[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-mri"
version = "0.1.0"
description = "Brain tumour MRI classification experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "kaggle>=1.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
