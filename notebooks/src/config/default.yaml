project:
  name: brain-tumour-mri
  seed: 42
paths:
  root: .
  primary_dataset_dir: data/raw/primary
  processed_dir: data/processed
  outputs_dir: outputs
dataset:
  image_size: 224
  channels: 3
  batch_size: 32
  num_workers: 0
  valid_extensions: ['.jpg', '.jpeg', '.png', '.bmp']
  train_fraction: 0.70
  validation_fraction: 0.15
models:
  baseline_cnn:
    dropout: 0.30
  tumordetnet:
    dropout: 0.35
    base_channels: 32
training:
  device: auto
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  use_weighted_loss: true
evaluation:
  average: weighted

