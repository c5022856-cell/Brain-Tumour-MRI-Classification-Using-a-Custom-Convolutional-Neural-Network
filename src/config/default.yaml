project:
  name: brain-tumor-detection
  seed: 42

paths:
  root: .
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  outputs_dir: outputs
  cache_dir: outputs/cache
  metrics_dir: outputs/metrics
  models_dir: outputs/models
  figures_dir: outputs/figures
  logs_dir: outputs/logs
  primary_dataset_dir: data/raw/primary
  primary_splits_csv: data/processed/primary_splits.csv

dataset:
  image_size: 224
  channels: 3
  valid_extensions:
    - .jpg
    - .jpeg
    - .png
    - .bmp
  val_size: 0.15
  test_size: 0.15
  num_workers: 0
  batch_size: 16
  augment:
    horizontal_flip: true
    rotation_degrees: 12
    brightness: 0.1
    contrast: 0.1

training:
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 4
  min_delta: 0.0
  device: auto
  use_weighted_loss: true

evaluation:
  average: weighted

models:
  baseline_cnn:
    dropout: 0.3
  tumordetnet:
    dropout: 0.4
    base_channels: 32

